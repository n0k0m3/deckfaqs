name: Build and Release DeckFAQs Offline

on:
    push:
        tags:
            - 'v*'
    pull_request:
        branches: ['main']

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install Dependencies
              run: npx pnpm@9 install --frozen-lockfile

            - name: build
              run: npx pnpm@9 build

            - name: copy files into build
              run: |
                  mkdir -p "./pkg/DeckFAQs Offline/dist"
                  cp plugin.json package.json main.py LICENSE "./pkg/DeckFAQs Offline/"
                  cp ./dist/index.js ./dist/index.js.map "./pkg/DeckFAQs Offline/dist/"

            - name: Upload package
              uses: actions/upload-artifact@v4
              with:
                  name: deckfaqs-offline
                  path: ./pkg
    release:
        needs: build
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/download-artifact@v4
              with:
                  name: deckfaqs-offline
                  path: pkg

            - name: zip/tar release
              run: |
                  cd pkg
                  zip -r ../deckfaqs-offline.zip "DeckFAQs Offline"
                  tar -czvf ../deckfaqs-offline.tar.gz "DeckFAQs Offline"

            - name: Create a release
              uses: ncipollo/release-action@v1
              with:
                  artifacts: 'deckfaqs-offline.zip,deckfaqs-offline.tar.gz'
                  bodyFile: 'release.md'
                  token: ${{ secrets.GITHUB_TOKEN }}
